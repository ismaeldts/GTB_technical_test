spring:
  application:
    name: demo

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/btg_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:cGFzc3dvcmRTZWNyZXRLZXlCVEdUZXN0MjAyNlZlcnlMb25nU2VjcmV0S2V5Rm9ySldU}
  expiration: ${JWT_EXPIRATION:86400000}

